<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --panel2: #171f30; --line: #243049;
    --text: #e6ebf5; --muted: #8592ad; --idle: #4a5670;
    --working: #3ea6ff; --done: #34d399; --blocked: #f87171; --accent: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; }
  body { min-height: 100vh; background:
    radial-gradient(1200px 600px at 30% -10%, #16233d 0%, transparent 60%), var(--bg); }
  header { display: flex; align-items: center; gap: 24px; padding: 18px 28px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 18px; letter-spacing: .08em; text-transform: uppercase; margin: 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .live { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--done); box-shadow: 0 0 10px var(--done); animation: pulse 1.6s infinite; }
  .live.off i { background: var(--blocked); box-shadow: 0 0 10px var(--blocked); }
  .stats { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-width: 92px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; }
  .stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 20px; padding: 20px 28px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  .floor { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; min-height: 640px; overflow: hidden; }
  .floor::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 32px 32px; opacity: .25; pointer-events: none; }
  svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .tier { position: relative; z-index: 2; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-bottom: 56px; }
  .tier:last-child { margin-bottom: 0; }
  .dept { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .dept-label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .dept-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .node { width: 176px; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; transition: border-color .3s, box-shadow .3s, transform .3s; }
  .node.working { border-color: var(--working); box-shadow: 0 0 0 1px var(--working), 0 0 24px -6px var(--working); }
  .node.done { border-color: #2a6b55; }
  .node.blocked { border-color: var(--blocked); box-shadow: 0 0 24px -8px var(--blocked); }
  .node.boss { width: 220px; }
  .node .name { font-weight: 600; font-size: 13px; line-height: 1.2; }
  .node .role { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
  .pill { display: inline-block; margin-top: 6px; font-size: 10px; font-family: 'JetBrains Mono', monospace; padding: 2px 7px; border-radius: 99px; background: #1e2840; color: var(--muted); }
  .working .pill { background: #0f2c4a; color: var(--working); }
  .done .pill { background: #0f3428; color: var(--done); }
  .blocked .pill { background: #3b1518; color: var(--blocked); }
  .task { grid-column: 1 / -1; font-size: 11px; color: var(--muted); min-height: 28px; line-height: 1.3; font-family: 'JetBrains Mono', monospace; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .models { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .models:empty { display: none; }
  .chip { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; padding: 2px 6px; border-radius: 6px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .chip.brain { background: #2a1f3d; color: #c4a7ff; }
  .chip.local { background: #10302a; color: #6ee7b7; }
  .chip.local.missing { background: #2a2109; color: var(--accent); }
  .legend { display: flex; gap: 10px; font-size: 11px; color: var(--muted); margin: -4px 0 12px; position: relative; z-index: 2; flex-wrap: wrap; }
  .gauge { width: 56px; height: 56px; position: relative; }
  .gauge svg { transform: rotate(-90deg); }
  .gauge .track { stroke: #222c42; }
  .gauge .bar { stroke: var(--idle); transition: stroke-dashoffset .6s ease, stroke .3s; stroke-linecap: round; }
  .working .gauge .bar { stroke: var(--working); }
  .done .gauge .bar { stroke: var(--done); }
  .blocked .gauge .bar { stroke: var(--blocked); }
  .gauge span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .working .gauge::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--working); animation: spin 1.2s linear infinite; }
  .wire { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .wire.hot { stroke: var(--working); stroke-opacity: .5; stroke-dasharray: 6 6; animation: flow 0.8s linear infinite; }
  .packet { fill: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }
  .packet.back { fill: var(--done); filter: drop-shadow(0 0 6px var(--done)); }
  aside { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .card h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; font-weight: 500; }
  .trail { list-style: none; margin: 0; padding: 0; max-height: 520px; overflow-y: auto; }
  .trail li { position: relative; padding: 0 0 14px 22px; font-size: 12.5px; line-height: 1.4; }
  .trail li::before { content: ''; position: absolute; left: 5px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
  .trail li::after { content: ''; position: absolute; left: 8.5px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
  .trail li:last-child::after { display: none; }
  .trail .t { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; }
  .trail .route { font-weight: 600; }
  .trail .msg { color: #b9c3d8; word-break: break-word; }
  .empty { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .empty code { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-size: 11.5px; }
  .pipeline { display: flex; gap: 6px; }
  .stage { flex: 1; text-align: center; font-size: 10.5px; padding: 10px 4px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .stage.on { border-color: var(--working); color: var(--working); background: #0f2238; }
  .stage.ok { border-color: #2a6b55; color: var(--done); }
  .switch { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; cursor: pointer; user-select: none; font: inherit; color: var(--text); }
  .switch .track2 { width: 54px; height: 28px; border-radius: 99px; background: #3b1518; position: relative; transition: background .25s; }
  .switch .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--blocked); transition: left .25s, background .25s; }
  .switch.on .track2 { background: #0f3428; }
  .switch.on .knob { left: 29px; background: var(--done); }
  .switch b { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .switch small { display: block; color: var(--muted); font-size: 10.5px; font-family: 'JetBrains Mono', monospace; }
  .switch:disabled { opacity: .5; cursor: wait; }
  .banner { display: none; margin: 14px 28px 0; padding: 12px 16px; border-radius: 12px; border: 1px solid #7a5a12; background: #2a2109; color: var(--accent); font-size: 13px; }
  .banner.show { display: block; }
  .node.paused { border-color: var(--accent); box-shadow: 0 0 22px -8px var(--accent); }
  .paused .pill { background: #2a2109; color: var(--accent); }
  .paused .gauge .bar { stroke: var(--accent); }
  .ckpt { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel2); font-size: 12px; line-height: 1.45; }
  .ckpt b { color: var(--accent); }
  .ckpt .k { color: var(--muted); }
  .btn { margin-top: 6px; font: inherit; font-size: 12px; background: #1e2840; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Studio <span>Control Room</span></h1>
  <div class="live" id="live"><i></i><span id="liveText">connecting…</span></div>
  <button class="switch" id="switch" type="button" aria-pressed="true" title="Safe stop / start all studio work">
    <span class="track2"><span class="knob"></span></span>
    <span><b id="swLabel">Running</b><small id="swSub">click to safe-stop</small></span>
  </button>
  <div class="stats">
    <div class="stat"><b id="sWorking">0</b><small>Working</small></div>
    <div class="stat"><b id="sDone">0</b><small>Handoffs done</small></div>
    <div class="stat"><b id="sBlocked">0</b><small>Blocked</small></div>
    <div class="stat"><b id="sTotal">0</b><small>Events</small></div>
  </div>
</header>
<div class="banner" id="banner"></div>
<main>
  <section class="floor" id="floor">
    <svg class="wires" id="wires"></svg>
    <div class="legend"><span><span class="chip brain">Claude</span> agent brain (cloud)</span><span><span class="chip local">local</span> model on this PC</span><span><span class="chip local missing">local</span> not installed yet</span></div>
    <div class="tier" id="tier0"></div>
    <div class="tier" id="tier1"></div>
    <div class="tier" id="tier2"></div>
    <div class="tier" id="tier3"></div>
  </section>
  <aside>
    <div class="card">
      <h2>Pipeline</h2>
      <div class="pipeline" id="pipeline"></div>
    </div>
    <div class="card">
      <h2>Checkpoints · where work stopped</h2>
      <div id="ckpts"><div class="empty">No saved checkpoints.</div></div>
    </div>
    <div class="card">
      <h2>Work trail</h2>
      <ul class="trail" id="trail"></ul>
    </div>
  </aside>
</main>
<script>
const ORG = {
  owner:   { name: 'You', role: 'Owner / CEO', tier: 0 },
  'rd-manager': { name: 'R&D Manager', role: 'Research · scoring · proposals', tier: 1 },
  manager: { name: 'Eng. Manager', role: 'Orchestrator · main session', tier: 1 },
  'creative-director': { name: 'Creative Director', role: 'Brand · briefs · asset review', tier: 1 },
  'image-artist':   { name: 'Image Artist', role: 'Generate & edit images', dept: 'Creative', parent: 'creative-director' },
  'video-producer': { name: 'Video Producer', role: 'Promo & preview clips', dept: 'Creative', parent: 'creative-director' },
  'copy-voice':     { name: 'Copy & Voice', role: 'Store copy · voice-over', dept: 'Creative', parent: 'creative-director' },
  'market-researcher':   { name: 'Market Researcher', role: 'Demand & pain signals', dept: 'R&D', parent: 'rd-manager' },
  'opportunity-analyst': { name: 'Opportunity Analyst', role: 'Concepts & scoring', dept: 'R&D', parent: 'rd-manager' },
  'product-manager': { name: 'Product Manager', role: 'Spec', dept: 'Plan' },
  architect:         { name: 'Architect', role: 'System design', dept: 'Plan' },
  'ui-ux-designer':  { name: 'UI/UX Designer', role: 'Flows & screens', dept: 'Plan' },
  'frontend-dev':    { name: 'Frontend Dev', role: 'Web', dept: 'Build' },
  'backend-dev':     { name: 'Backend Dev', role: 'API & data', dept: 'Build' },
  'mobile-dev':      { name: 'Mobile Dev', role: 'iOS & Android', dept: 'Build' },
  'devops-engineer': { name: 'DevOps', role: 'CI/CD & release', dept: 'Build' },
  'qa-engineer':     { name: 'QA Engineer', role: 'Acceptance tests', dept: 'Quality' },
  'code-reviewer':   { name: 'Code Reviewer', role: 'Review & security', dept: 'Quality' },
};
const STAGES = [
  ['Research', ['rd-manager', 'market-researcher', 'opportunity-analyst']],
  ['Spec', ['product-manager']], ['Design', ['architect', 'ui-ux-designer']],
  ['Build', ['frontend-dev', 'backend-dev', 'mobile-dev']], ['Verify', ['qa-engineer', 'code-reviewer']],
  ['Creative', ['creative-director', 'image-artist', 'video-producer', 'copy-voice']], ['Ship', ['devops-engineer']],
];
const C = 2 * Math.PI * 22;
const BOSS = new Set(['owner', 'manager', 'rd-manager', 'creative-director']);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function nodeHTML(id, o) {
  return `<div class="node ${BOSS.has(id) ? 'boss' : ''}" id="n-${id}">
    <div class="gauge"><svg width="56" height="56"><circle class="track" cx="28" cy="28" r="22" stroke-width="5" fill="none"/>
      <circle class="bar" cx="28" cy="28" r="22" stroke-width="5" fill="none" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><span>0%</span></div>
    <div><div class="name">${o.name}</div><div class="role">${o.role}</div><span class="pill">idle</span></div>
    <div class="task"></div><div class="models"></div></div>`;
}
function buildFloor() {
  $('tier0').innerHTML = nodeHTML('owner', ORG.owner);
  $('tier1').innerHTML = nodeHTML('rd-manager', ORG['rd-manager']) + '<div style="width:60px"></div>' + nodeHTML('manager', ORG.manager) + '<div style="width:60px"></div>' + nodeHTML('creative-director', ORG['creative-director']);
  const depts = {};
  for (const [id, o] of Object.entries(ORG)) if (o.dept) (depts[o.dept] ||= []).push([id, o]);
  const deptHTML = (d) => `<div class="dept"><div class="dept-label">${d}</div><div class="dept-row">${depts[d].map(([id, o]) => nodeHTML(id, o)).join('')}</div></div>`;
  $('tier2').innerHTML = deptHTML('R&D') + deptHTML('Plan') + deptHTML('Quality');
  $('tier3').innerHTML = deptHTML('Build') + deptHTML('Creative');
}

function deriveState(events) {
  const s = {};
  for (const id of Object.keys(ORG)) s[id] = { status: 'idle', pct: 0, task: '', tools: 0 };
  s.owner.task = 'Approves scope, merges, deploys';
  for (const e of events) {
    const a = s[e.agent] || (s[e.agent] = { status: 'idle', pct: 0, task: '', tools: 0 });
    if (e.type === 'start') { a.status = 'working'; a.pct = Math.max(5, 0); a.task = e.task; a.tools = 0; a.since = e.ts; }
    else if (e.type === 'tool') { a.tools++; if (a.status !== 'working') a.status = 'working'; a.lastTool = `${e.tool} ${e.detail || ''}`; if (!a.reported) a.pct = Math.min(90, 5 + a.tools * 4); }
    else if (e.type === 'progress') { a.reported = true; a.pct = e.pct; a.status = e.status || 'working'; a.task = e.message || a.task; }
    else if (e.type === 'done') { a.status = a.status === 'blocked' || a.status === 'paused' ? a.status : 'done'; a.pct = a.status === 'done' ? 100 : a.pct; a.reported = false; }
    else if (e.type === 'checkpoint') { a.status = 'paused'; a.task = 'Stopped: ' + e.message; }
    else if (e.type === 'resumed-agent') { a.status = 'working'; a.task = 'Resuming from checkpoint'; }
  }
  const anyWorking = Object.entries(s).some(([id, a]) => id !== 'manager' && id !== 'owner' && a.status === 'working');
  s.manager.status = anyWorking ? 'working' : (events.length ? 'done' : 'idle');
  const team = Object.keys(ORG).filter((id) => ORG[id].dept);
  s.manager.pct = Math.round(team.reduce((n, id) => n + s[id].pct, 0) / team.length);
  s.manager.task = anyWorking ? 'Coordinating: ' + team.filter((id) => s[id].status === 'working').map((id) => ORG[id].name).join(', ') : (events.length ? 'Waiting on next instruction' : 'Waiting for a project');
  return s;
}

function paintNodes(state) {
  for (const [id, a] of Object.entries(state)) {
    const el = $('n-' + id); if (!el) continue;
    el.className = `node ${BOSS.has(id) ? 'boss' : ''} ${a.status}`;
    el.querySelector('.bar').setAttribute('stroke-dashoffset', C * (1 - a.pct / 100));
    el.querySelector('.gauge span').textContent = id === 'owner' ? '—' : `${a.pct}%`;
    el.querySelector('.pill').textContent = a.status;
    el.querySelector('.task').textContent = a.status === 'working' && a.lastTool && !a.reported ? `${a.task} · ${a.lastTool}` : a.task;
  }
}

function center(el, floor) {
  const r = el.getBoundingClientRect(), f = floor.getBoundingClientRect();
  return { x: r.left - f.left + r.width / 2, top: r.top - f.top, bottom: r.bottom - f.top, y: r.top - f.top + r.height / 2 };
}
const packets = [];
function drawWires(state) {
  const floor = $('floor'), svg = $('wires');
  const o = center($('n-owner'), floor);
  const curve = (a, b) => `M${a.x} ${a.bottom} C ${a.x} ${(a.bottom + b.top) / 2}, ${b.x} ${(a.bottom + b.top) / 2}, ${b.x} ${b.top}`;
  let out = '';
  for (const boss of ['rd-manager', 'manager', 'creative-director']) out += `<path class="wire ${state[boss].status === 'working' ? 'hot' : ''}" d="${curve(o, center($('n-' + boss), floor))}"/>`;
  for (const id of Object.keys(ORG)) {
    if (!ORG[id].dept) continue;
    const m = center($('n-' + (ORG[id].parent || 'manager')), floor);
    const n = center($('n-' + id), floor);
    const d = `M${m.x} ${m.bottom} C ${m.x} ${(m.bottom + n.top) / 2}, ${n.x} ${(m.bottom + n.top) / 2}, ${n.x} ${n.top}`;
    out += `<path class="wire ${state[id].status === 'working' ? 'hot' : ''}" id="w-${id}" d="${d}"/>`;
  }
  svg.innerHTML = out + '<g id="pk"></g>';
}
function launch(agent, back) { packets.push({ agent, back, t: 0 }); }
function animate() {
  const g = document.getElementById('pk');
  if (g) {
    let html = '';
    for (let i = packets.length - 1; i >= 0; i--) {
      const p = packets[i], path = document.getElementById('w-' + p.agent);
      p.t += 0.012;
      if (!path || p.t >= 1) { packets.splice(i, 1); continue; }
      const L = path.getTotalLength(), pt = path.getPointAtLength((p.back ? 1 - p.t : p.t) * L);
      html += `<circle class="packet ${p.back ? 'back' : ''}" cx="${pt.x}" cy="${pt.y}" r="5"/>`;
    }
    g.innerHTML = html;
  }
  requestAnimationFrame(animate);
}

const COLORS = { start: 'var(--accent)', done: 'var(--done)', progress: 'var(--working)', tool: 'var(--idle)', paused: 'var(--blocked)', resumed: 'var(--done)', checkpoint: 'var(--accent)', 'resumed-agent': 'var(--working)' };

// ---------- Which model each worker uses ----------
function paintModels(map) {
  for (const id of Object.keys(ORG)) {
    const el = $('n-' + id); if (!el) continue;
    const m = map[id] || (id === 'manager' ? { brain: 'Session model' } : null);
    if (!m) continue;
    const local = (m.local || []).map((l) =>
      `<span class="chip local ${l.installed === false ? 'missing' : ''}" title="${esc(l.role || '')}${l.installed === false ? ' · not installed' : ''}">${esc(l.name)}</span>`).join('');
    el.querySelector('.models').innerHTML = (m.brain ? `<span class="chip brain" title="Agent brain">${esc(m.brain)}</span>` : '') + local;
  }
}

// ---------- Start / safe-stop switch ----------
const RESUME_PROMPT = 'Resume studio work: read .studio/checkpoints/ and continue each stopped task per CLAUDE.md.';
let control = { state: 'running' };
function paintControl(ckpts) {
  const on = control.state !== 'paused';
  const sw = $('switch');
  sw.classList.toggle('on', on); sw.setAttribute('aria-pressed', on);
  $('swLabel').textContent = on ? 'Running' : 'Paused';
  $('swSub').textContent = on ? 'click to safe-stop' : 'click to resume';
  const working = lastState ? Object.entries(lastState).filter(([id, a]) => ORG[id]?.dept && a.status === 'working').length : 0;
  const b = $('banner');
  b.classList.toggle('show', !on);
  b.textContent = on ? '' : working
    ? `Safe stop in progress: ${working} agent(s) are saving checkpoints at their next step. Nothing new will start.`
    : `Studio paused. ${ckpts.length} checkpoint(s) saved. Flip the switch to resume, then tell Claude: "${RESUME_PROMPT}"`;
}
function paintCheckpoints(ckpts) {
  $('ckpts').innerHTML = ckpts.length ? ckpts.map((c) => {
    const get = (k) => (c.text.match(new RegExp(`\\*\\*${k}:\\*\\* (.*)`)) || [])[1] || '';
    return `<div class="ckpt"><b>${esc(ORG[c.agent]?.name || c.agent)}</b> <span class="k">· ${new Date(c.ts).toLocaleString()}</span><br>
      <span class="k">Stopped:</span> ${esc(get('Where I stopped'))}<br><span class="k">Next:</span> ${esc(get('Next step'))}</div>`;
  }).join('') + `<button class="btn" id="copyResume">Copy resume prompt</button>` : '<div class="empty">No saved checkpoints.</div>';
  const cb = $('copyResume'); if (cb) cb.onclick = () => navigator.clipboard?.writeText(RESUME_PROMPT).then(() => (cb.textContent = 'Copied ✓'));
}
$('switch').addEventListener('click', async () => {
  const action = control.state === 'paused' ? 'resume' : 'pause';
  if (action === 'pause' && !confirm('Safe-stop the studio? Agents will save a checkpoint at their next step and stop.')) return;
  $('switch').disabled = true;
  try { control = await (await fetch('/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }) })).json(); }
  finally { $('switch').disabled = false; tick(); }
});
function paintTrail(events) {
  const name = (id) => ORG[id]?.name || id;
  const items = events.filter((e) => e.type !== 'tool' && e.type !== 'usage').slice(-80).reverse().map((e) => {
    const time = new Date(e.ts).toLocaleTimeString();
    let route, msg = '';
    if (e.type === 'paused' || e.type === 'resumed') { route = e.type === 'paused' ? '⏸ Studio paused' : '▶ Studio running'; msg = e.message; }
    else if (e.type === 'checkpoint') { route = `${name(e.agent)} saved checkpoint`; msg = `${e.message}${e.next ? ' → next: ' + e.next : ''}`; }
    else if (e.type === 'gate') { route = '🔔 Owner needed'; msg = e.message; }
    else if (e.type === 'resumed-agent') { route = `${name(e.agent)} resumed`; msg = e.message; }
    else if (e.type === 'start') { route = `Manager → ${name(e.agent)}`; msg = e.task; }
    else if (e.type === 'done') { route = `${name(e.agent)} → Manager`; msg = 'Handed work back' + (e.task ? `: ${e.task}` : ''); }
    else { route = `${name(e.agent)} · ${e.pct}%`; msg = e.message; }
    const c = e.status === 'blocked' ? 'var(--blocked)' : COLORS[e.type];
    return `<li style="--c:${c}"><div class="t">${time}</div><div class="route">${esc(route)}</div><div class="msg">${esc(msg)}</div></li>`;
  });
  $('trail').innerHTML = items.length ? items.join('') :
    `<li style="--c:var(--muted)"><div class="empty">No activity yet. Ask Claude to run the studio workflow, or simulate one:<br><code>node .studio/studio.js log architect 40 "Drafting data model"</code></div></li>`;
}
function paintPipeline(state) {
  $('pipeline').innerHTML = STAGES.map(([label, ids]) => {
    const st = ids.map((id) => state[id].status);
    const cls = st.includes('working') ? 'on' : st.includes('done') ? 'ok' : '';
    return `<div class="stage ${cls}">${label}</div>`;
  }).join('');
}

let seen = 0, lastState;
async function tick() {
  try {
    const events = await (await fetch('/events', { cache: 'no-store' })).json();
    $('live').classList.remove('off'); $('liveText').textContent = 'live · ' + new Date().toLocaleTimeString();
    for (const e of events.slice(seen)) {
      if (seen === 0) break; // no replay animation on first load
      if (e.type === 'start') launch(e.agent, false);
      if (e.type === 'done') launch(e.agent, true);
    }
    seen = events.length;
    const state = deriveState(events); lastState = state;
    paintNodes(state); drawWires(state); paintTrail(events); paintPipeline(state);
    const team = Object.keys(ORG).filter((id) => ORG[id].dept);
    $('sWorking').textContent = team.filter((id) => state[id].status === 'working').length;
    $('sBlocked').textContent = team.filter((id) => state[id].status === 'blocked').length;
    $('sDone').textContent = events.filter((e) => e.type === 'done').length;
    $('sTotal').textContent = events.length;
    control = await (await fetch('/control', { cache: 'no-store' })).json();
    const ckpts = await (await fetch('/checkpoints', { cache: 'no-store' })).json();
    paintControl(ckpts); paintCheckpoints(ckpts);
    paintModels(await (await fetch('/models', { cache: 'no-store' })).json());
  } catch {
    $('live').classList.add('off'); $('liveText').textContent = 'server offline';
  }
}
buildFloor();
window.addEventListener('resize', () => lastState && drawWires(lastState));
tick(); setInterval(tick, 1000); requestAnimationFrame(animate);
</script>
